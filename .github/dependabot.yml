# Baseline Dependabot config — weekly, grouped one-PR-per-ecosystem, targeting
# the `dev` integration branch; the automerge workflow lands green PRs
# automatically and `dev` is promoted to `main` by Nick's manual merge.
# NOTE: Dependabot reads this file from the repo's DEFAULT branch (main) only —
# it does nothing until this wiring is promoted from dev to main.
version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Legacy Python reference tree (financial_analysis/) — no uv.lock is
  # committed, so the pip ecosystem reads pyproject.toml directly. Keeps the
  # deps patched while the tree exists; drop this entry when the Rust rewrite
  # replaces it.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(py)"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # The SHA-pinned actions in .github/workflows/*.yml (checkout, rust-toolchain).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions:
        patterns:
          - "*"
